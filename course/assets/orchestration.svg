<rect x="60" y="470" width="360" height="136" rx="12" fill="white" stroke="#dce3dd"/>
<text x="80" y="508" font-family="Heiti SC,Noto Sans CJK SC,sans-serif" font-size="25" fill="#183c30">06 / 基线与评测决策</text>
<text x="80" y="545" font-family="Heiti SC,Noto Sans CJK SC,sans-serif" font-size="19" fill="#52645b">比较质量与资源</text>
<text x="80" y="571" font-family="Heiti SC,Noto Sans CJK SC,sans-serif" font-size="19" fill="#52645b">无收益就不增复杂度</text>
<rect x="520" y="470" width="360" height="136" rx="12" fill="white" stroke="#dce3dd"/>
<text x="540" y="508" font-family="Heiti SC,Noto Sans CJK SC,sans-serif" font-size="25" fill="#183c30">05 / 多个决策主体</text>
<text x="540" y="545" font-family="Heiti SC,Noto Sans CJK SC,sans-serif" font-size="19" fill="#52645b">可独立的工作任务</text>
<text x="540" y="571" font-family="Heiti SC,Noto Sans CJK SC,sans-serif" font-size="19" fill="#52645b">协调、冲突和总预算</text>
<rect x="980" y="470" width="360" height="136" rx="12" fill="white" stroke="#dce3dd"/>
<text x="1000" y="508" font-family="Heiti SC,Noto Sans CJK SC,sans-serif" font-size="25" fill="#183c30">04 / 状态图与检查点</text>
