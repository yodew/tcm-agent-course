<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040">
<rect width="100%" height="100%" fill="#f4f6f3"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#7e8d84"/></marker></defs>
<text x="60" y="52" font-family="Heiti SC,Noto Sans CJK SC,sans-serif" font-size="18" fill="#557265">TCM AGENT / ENGINEERING COURSE / 02</text>
<text x="60" y="117" font-family="Heiti SC,Noto Sans CJK SC,sans-serif" font-size="39" fill="#183c30">系统架构：模型负责选择，服务端掌握权限</text>
<text x="60" y="157" font-family="Heiti SC,Noto Sans CJK SC,sans-serif" font-size="20" fill="#52645b">生产主线是单进程模块化后端；LangGraph 和 MCP 是可运行的独立对照示例。</text>
<path d="M420,288 L520,288" stroke="#7e8d84" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M880,288 L980,288" stroke="#7e8d84" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M980,288 L420,538" stroke="#7e8d84" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M980,288 L880,538" stroke="#7e8d84" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M240,606 L240,720" stroke="#7e8d84" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M880,538 L980,538" stroke="#7e8d84" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M700,606 L700,720" stroke="#7e8d84" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M880,538 L980,788" stroke="#7e8d84" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="60" y="220" width="360" height="136" rx="12" fill="white" stroke="#dce3dd"/>
<text x="80" y="258" font-family="Heiti SC,Noto Sans CJK SC,sans-serif" font-size="25" fill="#183c30">01 / 调用入口</text>
<text x="80" y="295" font-family="Heiti SC,Noto Sans CJK SC,sans-serif" font-size="19" fill="#52645b">Chainlit / OpenAPI / CLI</text>
<text x="80" y="321" font-family="Heiti SC,Noto Sans CJK SC,sans-serif" font-size="19" fill="#52645b">用户显式授权与确认</text>
<rect x="520" y="220" width="360" height="136" rx="12" fill="white" stroke="#dce3dd"/>
<text x="540" y="258" font-family="Heiti SC,Noto Sans CJK SC,sans-serif" font-size="25" fill="#183c30">02 / FastAPI 边界</text>
<text x="540" y="295" font-family="Heiti SC,Noto Sans CJK SC,sans-serif" font-size="19" fill="#52645b">Bearer 身份、类型解析</text>
<text x="540" y="321" font-family="Heiti SC,Noto Sans CJK SC,sans-serif" font-size="19" fill="#52645b">访问隔离与错误合同</text>
<rect x="980" y="220" width="360" height="136" rx="12" fill="white" stroke="#dce3dd"/>
<text x="1000" y="258" font-family="Heiti SC,Noto Sans CJK SC,sans-serif" font-size="25" fill="#183c30">03 / 应用服务</text>
<text x="1000" y="295" font-family="Heiti SC,Noto Sans CJK SC,sans-serif" font-size="19" fill="#52645b">幂等占位、总时限</text>
<text x="1000" y="321" font-family="Heiti SC,Noto Sans CJK SC,sans-serif" font-size="19" fill="#52645b">CAS 原子提交与降级</text>
<rect x="60" y="470" width="360" height="136" rx="12" fill="white" stroke="#dce3dd"/>
<text x="80" y="508" font-family="Heiti SC,Noto Sans CJK SC,sans-serif" font-size="25" fill="#183c30">04 / 持久化仓库</text>
<text x="80" y="545" font-family="Heiti SC,Noto Sans CJK SC,sans-serif" font-size="19" fill="#52645b">会话快照与原始回合</text>
<text x="80" y="571" font-family="Heiti SC,Noto Sans CJK SC,sans-serif" font-size="19" fill="#52645b">短事务；网络调用在事务外</text>
<rect x="520" y="470" width="360" height="136" rx="12" fill="white" stroke="#dce3dd"/>
<text x="540" y="508" font-family="Heiti SC,Noto Sans CJK SC,sans-serif" font-size="25" fill="#183c30">05 / Agent Runtime</text>
<text x="540" y="545" font-family="Heiti SC,Noto Sans CJK SC,sans-serif" font-size="19" fill="#52645b">有界工具循环与参数校验</text>
<text x="540" y="571" font-family="Heiti SC,Noto Sans CJK SC,sans-serif" font-size="19" fill="#52645b">不执行任意代码或模型写入</text>
<rect x="980" y="470" width="360" height="136" rx="12" fill="white" stroke="#dce3dd"/>
<text x="1000" y="508" font-family="Heiti SC,Noto Sans CJK SC,sans-serif" font-size="25" fill="#183c30">06 / 模型网关</text>
<text x="1000" y="545" font-family="Heiti SC,Noto Sans CJK SC,sans-serif" font-size="19" fill="#52645b">Responses / Chat 双协议</text>
<text x="1000" y="571" font-family="Heiti SC,Noto Sans CJK SC,sans-serif" font-size="19" fill="#52645b">隔离重放状态与调用预算</text>
<rect x="60" y="720" width="360" height="136" rx="12" fill="white" stroke="#dce3dd"/>
<text x="80" y="758" font-family="Heiti SC,Noto Sans CJK SC,sans-serif" font-size="25" fill="#183c30">07 / SQLite / PostgreSQL</text>
<text x="80" y="795" font-family="Heiti SC,Noto Sans CJK SC,sans-serif" font-size="19" fill="#52645b">本地已验证 / 部署可选</text>
<text x="80" y="821" font-family="Heiti SC,Noto Sans CJK SC,sans-serif" font-size="19" fill="#52645b">迁移、版本计数与租约</text>
<rect x="520" y="720" width="360" height="136" rx="12" fill="white" stroke="#dce3dd"/>
<text x="540" y="758" font-family="Heiti SC,Noto Sans CJK SC,sans-serif" font-size="25" fill="#183c30">08 / 知识检索</text>
<text x="540" y="795" font-family="Heiti SC,Noto Sans CJK SC,sans-serif" font-size="19" fill="#52645b">BM25 + 可选真实 Embedding</text>
<text x="540" y="821" font-family="Heiti SC,Noto Sans CJK SC,sans-serif" font-size="19" fill="#52645b">来源版本与精确引用</text>
<rect x="980" y="720" width="360" height="136" rx="12" fill="white" stroke="#dce3dd"/>
<text x="1000" y="758" font-family="Heiti SC,Noto Sans CJK SC,sans-serif" font-size="25" fill="#183c30">09 / 策略与输出渲染</text>
<text x="1000" y="795" font-family="Heiti SC,Noto Sans CJK SC,sans-serif" font-size="19" fill="#52645b">用户事实逐字溯源</text>
<text x="1000" y="821" font-family="Heiti SC,Noto Sans CJK SC,sans-serif" font-size="19" fill="#52645b">确认事实摘要与模板输出</text>
<text x="60" y="995" font-family="Heiti SC,Noto Sans CJK SC,sans-serif" font-size="18" fill="#52645b">模型看不到服务端密钥、账户权限或任意数据库接口。</text>
</svg>