[project]
name = "tcm-agent-course"
version = "1.4.0"
description = "Verifiable Python agent engineering course and visit-preparation service"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
 "pydantic-settings>=2.7,<3", "sqlalchemy[asyncio]>=2.0.36,<3",
 "aiosqlite>=0.20,<1", "asyncpg>=0.30,<1", "alembic>=1.14,<2",
 "httpx2[http2,brotli,zstd]>=2,<3", "anyio>=4.8,<5",
 "typer>=0.15,<1", "rich>=13.9,<15", "prometheus-client>=0.21,<1",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "httpx>=0.28,<1", "ruff>=0.12,<1", "basedpyright>=1.30,<2", "pillow>=11,<13", "cairosvg>=2.7,<3"]
[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]
graph = ["langgraph>=1,<2"]
ui = [
    "chainlit>=2.11,<3",
]
[project.scripts]
tcm = "tcm_agent.cli:app"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/tcm_agent"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["live: requires explicitly configured provider", "postgres: requires PostgreSQL"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["ALL"]
ignore = ["D100", "D104", "D105", "D107", "D203", "D213", "COM812", "ISC001", "E501", "TRY003", "EM101", "EM102", "RUF001", "RUF002", "RUF003", "TD002", "TD003", "FIX002", "FBT001", "FBT002", "CPY001", "D101", "D401", "PLR2004", "TC001", "TC002", "TC003"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "PLR2004", "ARG"]
"examples/**" = ["T201", "INP001", "S101"]
"migrations/**" = ["D", "INP001"]
"scripts/**" = ["T201", "INP001"]
"labs/**" = ["T201"]
"exercises/acceptance.py" = ["S101", "D", "ARG", "PLR2004"]
"exercises/starter.py" = ["ARG001"]
[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.12"
include = ["src/tcm_agent", "labs", "exercises/solution.py"]
reportUnusedCallResult = false
reportImplicitStringConcatenation = false
# Keep explicit assert_never arms as future-variant guards.
reportUnnecessaryComparison = false
